[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.3.0"
description = "Deterministic data foundation for a music-store customer-service agent"
requires-python = ">=3.11"
dependencies = ["pypdf==6.10.0"]

[project.optional-dependencies]
ui = ["streamlit==1.66.1"]
desktop = ["streamlit==1.66.1", "pywebview==6.2.1; sys_platform == 'win32'"]

[tool.setuptools]
packages = ["app"]

[project.scripts]
emporio-agent = "app.cli:main"

[tool.setuptools.package-data]
app = ["fixtures/*.json"]
